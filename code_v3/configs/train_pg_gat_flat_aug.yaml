name: "train_pg_gat_flat_aug"
description: "PEng control: flat PG-GAT at champion-arch widths (3L / 4H / hidden 64 / output 256 / joint emb 64 / dropout 0.1) + the same detection-realistic augmentation and synthetic recipe as train_pg_gat_hier_aug. No W&B."

sa_gat:
  num_joint_types: 17
  joint_embedding_dim: 64
  raw_feature_dim: 4
  hidden_dim: 64
  output_dim: 256
  num_layers: 3
  num_heads: 4
  dropout: 0.1
  use_layer_norm: true
  l2_normalize: true
  use_depth: false
  use_type_pair_attention: true
  use_position_encoding: true
  use_repulsion_heads: true
  n_repulsion_heads: 1

gat:
  num_joint_types: 17
  joint_embedding_dim: 32
  raw_feature_dim: 4
  hidden_dim: 64
  output_dim: 128
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  use_layer_norm: true
  l2_normalize: true
  use_depth: false

loss:
  contrastive_margin: 0.5

training:
  virtual_dir:   data/virtual
  batch_size:    4
  num_workers:   4
  lr:            1.0e-3
  lr_min:        1.0e-5
  weight_decay:  1.0e-4
  epochs:        50
  val_every:     5
  save_best:     true
  joint_drop_max: 0.4
  force_visible: true
