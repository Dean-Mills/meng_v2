# PG-GAT COCO fine-tune sweep
#
# Defends RQ6 (how much does COCO fine-tuning lift performance, and does it
# damage synthetic performance) for the dissertation. Loads the synth-only
# champion (`outputs/frozen_checkpoints/sa_gat_full/best.pt`) and sweeps over
# fine-tune epochs, learning rate, and weight decay on COCO train2017.
#
# Selection metric: val/pga --- but the val set is synth, so the metric
# captures "did fine-tuning damage the synthetic checkpoint?" The actual
# headline number (COCO val PGA) is computed by re-running eval_cop_kmeans.py
# on the winning checkpoint after the sweep finishes.
#
# Budget: 16 runs, hyperband.
#
# Parameter names use `__` as a path separator. See pg_gat_arch_mini.yaml.

project: multiperson-pose-grouping
entity:  deanmills
program: trainer.py
method: bayes
metric:
  name: val/pga
  goal: maximize

parameters:
  training__epochs:
    values: [10, 15, 20, 30, 50]
  training__lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 5.0e-4
  training__weight_decay:
    values: [1.0e-5, 1.0e-4, 1.0e-3]

early_terminate:
  type: hyperband
  min_iter: 3
  eta: 2

run_cap: 16

# Architecture and pretrained checkpoint are fixed; only the fine-tune
# schedule is swept. Update the architecture lines if pg_gat_arch.yaml winner
# differs from the manual default.
command:
  - ${env}
  - python
  - ${program}
  - --config=configs/train_sa_gat_sweep_base.yaml
  - --name=pg_gat_finetune_sweep
  - --set=wandb.group=pg-gat-finetune-sweep
  - --tag=sweep
  - --tag=finetune
  - --tag=meng-paper
  - --set=sa_gat.num_layers=2
  - --set=sa_gat.num_heads=4
  - --set=sa_gat.hidden_dim=64
  - --set=sa_gat.output_dim=128
  - --set=training.coco_train_dir=data/coco2017/train2017
  - --set=training.coco_train_ann=data/coco2017/annotations/person_keypoints_train2017.json
  - --set=training.pretrained=outputs/frozen_checkpoints/sa_gat_full/best.pt
  - --set=training.val_every=2
  - ${args}
