name: "train_trigat"
description: "TriGAT — GAT over skeleton triplets (19 canonical COCO triplets per person)"

# Standard GAT config required by the schema (unused when trigat is set)
gat:
  num_joint_types: 17
  joint_embedding_dim: 32
  raw_feature_dim: 4
  hidden_dim: 64
  output_dim: 128
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  use_layer_norm: true
  l2_normalize: true
  use_depth: false

trigat:
  num_layers: 2
  num_heads: 4
  hidden_dim: 64
  output_dim: 128
  triplet_embedding_dim: 16
  dropout: 0.1
  use_layer_norm: true
  l2_normalize: true

loss:
  contrastive_margin: 0.5

training:
  virtual_dir:   data/virtual
  batch_size:    4
  num_workers:   4
  lr:            1e-3
  lr_min:        1e-5
  weight_decay:  1e-4
  epochs:        50
  val_every:     5
  save_best:     true

wandb:
  project:       "multiperson-pose-grouping"
  entity:        "deanmills"
  group:         "meng-rerun-trigat"
  tags:          ["ablation", "meng-paper", "dissertation-final", "meng-rerun", "negative-result"]
  notes:         "TriGAT triplet primitive (negative result) - re-run for W&B."
  mode:          "online"
  log_artifacts: true
  log_code:      true
