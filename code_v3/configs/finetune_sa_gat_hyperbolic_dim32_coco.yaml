name: "finetune_sa_gat_hyperbolic_dim32_coco"
description: "Fine-tune hyperbolic SA-GAT dim=32 on COCO train2017, starting from synthetic pre-trained weights"

gat:
  num_joint_types: 17
  joint_embedding_dim: 32
  raw_feature_dim: 4
  hidden_dim: 64
  output_dim: 32
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  use_layer_norm: true
  l2_normalize: true
  use_depth: false

sa_gat_hyperbolic:
  num_joint_types: 17
  joint_embedding_dim: 32
  raw_feature_dim: 4
  hidden_dim: 64
  output_dim: 32
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  use_layer_norm: true
  use_depth: false
  use_type_pair_attention: true
  use_position_encoding: true
  use_repulsion_heads: true
  n_repulsion_heads: 1

loss:
  contrastive_margin: 2.0

training:
  virtual_dir:     data/virtual
  coco_train_dir:  data/coco2017/train2017
  coco_train_ann:  data/coco2017/annotations/person_keypoints_train2017.json
  pretrained:      outputs/train_sa_gat_hyperbolic_dim32/latest/best.pt
  batch_size:      4
  num_workers:     4
  lr:              1e-4
  lr_min:          1e-6
  weight_decay:    1e-4
  epochs:          20
  val_every:       2
  save_best:       true

wandb:
  project:       "multiperson-pose-grouping"
  entity:        "deanmills"
  group:         "meng-rerun-hyperbolic"
  tags:          ["finetune", "meng-paper", "dissertation-final", "meng-rerun"]
  notes:         "Hyperbolic dim=32 COCO fine-tune (Option B) - re-run for W&B."
  mode:          "online"
  log_artifacts: true
  log_code:      true
