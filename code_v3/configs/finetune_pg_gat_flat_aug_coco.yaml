name: "finetune_pg_gat_flat_aug_coco"
description: "PEng control: COCO fine-tune of train_pg_gat_flat_aug, same recipe and augmentation as finetune_pg_gat_hier_aug_coco. Set training.pretrained via --set. No W&B."

sa_gat:
  num_joint_types: 17
  joint_embedding_dim: 64
  raw_feature_dim: 4
  hidden_dim: 64
  output_dim: 256
  num_layers: 3
  num_heads: 4
  dropout: 0.1
  use_layer_norm: true
  l2_normalize: true
  use_depth: false
  use_type_pair_attention: true
  use_position_encoding: true
  use_repulsion_heads: true
  n_repulsion_heads: 1

gat:
  num_joint_types: 17
  joint_embedding_dim: 32
  raw_feature_dim: 4
  hidden_dim: 64
  output_dim: 128
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  use_layer_norm: true
  l2_normalize: true
  use_depth: false

loss:
  contrastive_margin: 0.5

training:
  virtual_dir:   data/virtual
  coco_train_dir: data/coco2017/train2017
  coco_train_ann: data/coco2017/annotations/person_keypoints_train2017.json
  pretrained:    null
  batch_size:    4
  num_workers:   4
  lr:            3.8417518776322576e-4
  lr_min:        1.0e-5
  weight_decay:  1.0e-4
  epochs:        15
  val_every:     2
  save_best:     true
  joint_drop_max: 0.4
  force_visible: true
