name: "train_dec"
description: "GAT + DEC (Deep Embedded Clustering) end-to-end on virtual data, no depth. Per-scene k-means++ cluster-centre init; KL(p || q) sharpening loss. Documented failed learned head."

gat:
  num_joint_types: 17
  joint_embedding_dim: 32
  raw_feature_dim: 4
  hidden_dim: 64
  output_dim: 128
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  use_layer_norm: true
  l2_normalize: true
  use_depth: false

dec:
  n_clusters:      10     # placeholder; DEC.forward(emb, k) re-inits centres per scene with the scene's k
  alpha:           1.0
  update_interval: 100

loss:
  contrastive_margin: 0.5
  dec_weight:         1.0

training:
  virtual_dir:   data/virtual
  batch_size:    4
  num_workers:   4
  lr:            1e-3
  lr_min:        1e-5
  weight_decay:  1e-4
  epochs:        50
  val_every:     5
  save_dir:      outputs/checkpoints/dec
  save_best:     true

wandb:
  project:       "multiperson-pose-grouping"
  entity:        "deanmills"
  group:         "meng-rerun-learned-heads"
  tags:          ["ablation", "meng-paper", "dissertation-final", "meng-rerun", "negative-result"]
  notes:         "DEC learned head on real synth data - first failed learned head. KL(p || q) is unsupervised; expected to match kNN baseline because the sharpening cannot fix wrong assignments."
  mode:          "online"
  log_artifacts: true
  log_code:      true
