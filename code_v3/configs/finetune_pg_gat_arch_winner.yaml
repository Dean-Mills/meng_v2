name: "finetune_pg_gat_arch_winner"
description: "Fine-tune champion-arch (PG-GAT: 3L / 4H / hidden 64 / output 256 / joint emb 64 / dropout 0.1) on COCO train2017. Loads outputs/pg_gat_arch_sweep/08d0ffde/best.pt as pretrained. Recipe matches the existing finetune_sa_gat_coco protocol (20 ep, lr=1e-4) — this is the single-run fine-tune referenced in catchup_2 § 'Architecture Sweep'."

sa_gat:
  num_joint_types: 17
  joint_embedding_dim: 64
  raw_feature_dim: 4
  hidden_dim: 64
  output_dim: 256
  num_layers: 3
  num_heads: 4
  dropout: 0.1
  use_layer_norm: true
  l2_normalize: true
  use_depth: false
  use_type_pair_attention: true
  use_position_encoding: true
  use_repulsion_heads: true
  n_repulsion_heads: 1

gat:
  num_joint_types: 17
  joint_embedding_dim: 64
  raw_feature_dim: 4
  hidden_dim: 64
  output_dim: 256
  num_layers: 3
  num_heads: 4
  dropout: 0.1
  use_layer_norm: true
  l2_normalize: true
  use_depth: false

loss:
  contrastive_margin: 0.5

training:
  virtual_dir:      data/virtual
  coco_train_dir:   data/coco2017/train2017
  coco_train_ann:   data/coco2017/annotations/person_keypoints_train2017.json
  pretrained:       outputs/pg_gat_arch_sweep/08d0ffde/best.pt
  batch_size:       4
  num_workers:      4
  lr:               1.0e-4
  lr_min:           1.0e-6
  weight_decay:     1.0e-4
  epochs:           20
  val_every:        2
  save_best:        true

wandb:
  project:       "multiperson-pose-grouping"
  entity:        "deanmills"
  group:         "pg-gat-finetune"
  tags:          ["finetune", "champion-arch", "meng-paper"]
  mode:          "online"
  log_artifacts: true
  log_code:      true
